<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Registrasi — Daily Habit Tracker</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem;">
    <div class="card" style="max-width: 420px; width: 100%;">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <h1 style="color: var(--primary); font-size: 1.6rem; font-weight: 800;">Daily Habit Tracker</h1>
        <p class="card-desc" style="margin-top: 0.25rem;">Bangun kebiasaan positif dan pantau konsistensi Anda setiap hari.</p>
      </div>

      <!-- Tab Navigasi Login / Register -->
      <div style="display: flex; border-bottom: 1px solid var(--gray-200); margin-bottom: 1.25rem;">
        <button id="tab-login" class="btn" style="flex: 1; border-radius: 0; border-bottom: 2px solid var(--primary); background: transparent; color: var(--primary);">Login</button>
        <button id="tab-register" class="btn" style="flex: 1; border-radius: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--gray-600);">Daftar Akun</button>
      </div>

      <div id="alert-box" style="display: none;"></div>

      <!-- Form Login -->
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Alamat Email</label>
          <input type="email" id="login-email" class="form-control" placeholder="nama@email.com" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Kata Sandi</label>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.25rem;">Masuk ke Akun</button>
      </form>

      <!-- Form Register -->
      <form id="register-form" style="display: none;">
        <div class="form-group">
          <label class="form-label" for="reg-name">Nama Lengkap</label>
          <input type="text" id="reg-name" class="form-control" placeholder="Contoh: Budi Santoso" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-email">Alamat Email</label>
          <input type="email" id="reg-email" class="form-control" placeholder="nama@email.com" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-password">Kata Sandi (minimal 6 karakter)</label>
          <input type="password" id="reg-password" class="form-control" placeholder="••••••••" minlength="6" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.25rem;">Buat Akun Baru</button>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
